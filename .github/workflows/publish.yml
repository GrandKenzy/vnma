name: Publish VNMA to PyPI

# Publish only when the release version or this workflow changes on main.
# The publishing job uses PyPI Trusted Publishing (OIDC), not long-lived tokens.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  test:
    name: Verify release on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install VNMA from the release commit
        run: python -m pip install -e .
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build and validate distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify built wheel metadata
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import vnma, importlib.metadata, tomllib; from pathlib import Path; version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert vnma.__version__ == version; assert importlib.metadata.version('vnma') == version"
          python -m vnma --help
      - uses: actions/upload-artifact@v4
        with:
          name: vnma-release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish validated artifacts to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vnma/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vnma-release-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
