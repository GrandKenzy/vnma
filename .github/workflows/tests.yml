name: VNMA tests

on:
  push:
    branches: [actualizar-vnma]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify editable install version
        run: python -c "import importlib.metadata, vnma; assert vnma.__version__ == '0.3.1'; assert importlib.metadata.version('vnma') == '0.3.1'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  pypi-install-smoke:
    name: Published PyPI package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install VNMA directly from PyPI
        run: python -m pip install vnma
      - name: Check installed distribution and CLI
        run: |
          python -m pip show vnma
          python -m vnma --help

  branch-wheel-smoke:
    name: Build and install VNMA 0.3.1 wheel from branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build source wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Install built distribution
        run: python -m pip install --force-reinstall dist/vnma-0.3.1-py3-none-any.whl
      - name: Verify installed wheel from outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import vnma, importlib.metadata; assert vnma.__version__ == '0.3.1'; assert importlib.metadata.version('vnma') == '0.3.1'"
          python -m vnma --help

  gram-easyc-integration:
    name: Integration with real Gram and EasyC manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GrandKenzy/Gram
          path: interop/Gram
      - uses: actions/checkout@v4
        with:
          repository: GrandKenzy/EasyC
          path: interop/EasyC
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development version
        run: python -m pip install -e .
      - name: Activate EasyC example's real editable Gram declaration
        working-directory: interop/EasyC
        run: |
          python -c "from pathlib import Path; p=Path('vnma.toml.example'); text=p.read_text(); old='# gram = { path = \"~/Desktop/Gram\", editable = true }'; assert old in text; Path('vnma.toml').write_text(text.replace(old, 'gram = { path = \"../Gram\", editable = true }'))"
      - name: Link Gram through EasyC and verify import
        working-directory: interop/EasyC
        run: |
          python -m vnma install
          python -c "from pathlib import Path; Path('verify_gram.py').write_text('import gram\nassert gram.__version__ == \"2.0.0b1\"\n')"
          python -m vnma run verify_gram.py
          python -c "from vnma.core.config import ConfigHandler; from pathlib import Path; c=ConfigHandler.load(Path('vnma.toml')); assert set(c.dependencies)=={'gram'}, c.dependencies"
