name: VNMA tests

on:
  push:
    branches: [actualizar-vnma]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify editable install version
        run: python -c "import importlib.metadata, vnma; assert vnma.__version__ == '0.3.0'; assert importlib.metadata.version('vnma') == '0.3.0'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  pypi-install-smoke:
    name: Published PyPI package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install VNMA directly from PyPI
        run: python -m pip install vnma
      - name: Check installed distribution and CLI
        run: |
          python -m pip show vnma
          python -m vnma --help

  branch-wheel-smoke:
    name: Build and install VNMA 0.3.0 wheel from branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build source wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Install built distribution
        run: python -m pip install --force-reinstall dist/vnma-0.3.0-py3-none-any.whl
      - name: Verify installed wheel from outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import vnma, importlib.metadata; assert vnma.__version__ == '0.3.0'; assert importlib.metadata.version('vnma') == '0.3.0'"
          python -m vnma --help
