[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vnma"
version = "0.3.2"
description = "Vendor Manager for Python — hermetic, zero-venv dependency management."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "VNMA Team" }
]
keywords = ["vendoring", "packaging", "dependencies", "hermetic", "pip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/GrandKenzy/vnma"
Documentation = "https://github.com/GrandKenzy/vnma/tree/main/docs"
Repository = "https://github.com/GrandKenzy/vnma.git"
"Bug Tracker" = "https://github.com/GrandKenzy/vnma/issues"

[project.scripts]
vnma = "vnma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vnma*"]
exclude = ["tests*", "docs*"]
