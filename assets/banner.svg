<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.3"/>
    </pattern>

    <!-- Glowing Highlights -->
    <radialGradient id="glowLeft" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo & Text Gradients -->
    <linearGradient id="textCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="pillCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Isometric Face Shading -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadowBox">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#techGrid)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="420" fill="url(#glowLeft)"/>
  <rect width="1200" height="420" fill="url(#glowRight)"/>

  <!-- Top & Bottom Border Lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- LEFT: Isometric Icon Symbol -->
  <g transform="translate(140, 205) scale(0.78)">
    <g filter="url(#shadowBox)" transform="translate(-256, -250)">
      <!-- Top Face -->
      <polygon points="256,110 376,176 256,242 136,176" fill="url(#topFace)" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="136,176 256,242 256,380 136,314" fill="url(#leftFace)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Right Face -->
      <polygon points="256,242 376,176 376,314 256,380" fill="url(#rightFace)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>

      <line x1="256" y1="110" x2="256" y2="176" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Glowing 'V' ribbons -->
      <path d="M 186,175 L 256,325 L 230,340 L 156,190 Z" fill="url(#primaryGrad)"/>
      <path d="M 186,175 L 236,145 L 256,325 L 206,355 Z" fill="#38BDF8" opacity="0.9"/>

      <path d="M 326,175 L 256,325 L 282,340 L 356,190 Z" fill="url(#accentGrad)"/>
      <path d="M 326,175 L 276,145 L 256,325 L 306,355 Z" fill="#FCD34D" opacity="0.9"/>

      <circle cx="256" cy="325" r="9" fill="#FFFFFF"/>
      <circle cx="256" cy="325" r="18" fill="#38BDF8" opacity="0.4"/>
    </g>
  </g>

  <!-- RIGHT: Typography & Badges -->
  <g transform="translate(390, 115)">
    <!-- Version Pill -->
    <rect x="0" y="0" width="138" height="28" rx="14" fill="url(#pillCyan)" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#38BDF8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#BAE6FD" letter-spacing="0.5">RELEASE v0.3.0</text>

    <!-- Main Title -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="78" font-weight="900" fill="url(#textCyanGrad)" letter-spacing="4">VNMA</text>

    <!-- Subtitle / Brand definition -->
    <text x="5" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
      VENDOR MANAGER FOR PYTHON
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Zero-Venv -->
      <rect x="0" y="0" width="128" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="18" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">⚡ Zero-Venv</text>

      <!-- Pill 2: Hermetic Isolation -->
      <rect x="138" y="0" width="158" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="154" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🔒 Hermetic Paths</text>

      <!-- Pill 3: Atomic Transactions -->
      <rect x="306" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="322" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#FBBF24">🛡️ Atomic Rollback</text>

      <!-- Pill 4: Live Links -->
      <rect x="496" y="0" width="138" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="512" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#A7F3D0">🔗 Live Links</text>
    </g>
  </g>
</svg>
