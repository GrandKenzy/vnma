<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>

    <!-- Neon Cyan/Blue Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Box Face Shading -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Ambient Backdrop Circles -->
  <circle cx="256" cy="240" r="160" fill="#0284C7" opacity="0.12" filter="blur(40px)"/>
  <circle cx="290" cy="270" r="120" fill="#F59E0B" opacity="0.08" filter="blur(35px)"/>

  <!-- Isometric Vendor Cube -->
  <g filter="url(#softShadow)" transform="translate(0, -10)">
    <!-- Top Face -->
    <polygon points="256,110 376,176 256,242 136,176" fill="url(#topFace)" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="136,176 256,242 256,380 136,314" fill="url(#leftFace)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="256,242 376,176 376,314 256,380" fill="url(#rightFace)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Seam line on top -->
    <line x1="256" y1="110" x2="256" y2="176" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- Futuristic Stylized 'V' ribbon carving out of the box -->
  <g filter="url(#glow)">
    <!-- Left Wing of 'V' (Cyan/Blue Python Hue) -->
    <path d="M 186,175 L 256,325 L 230,340 L 156,190 Z" fill="url(#primaryGrad)"/>
    <path d="M 186,175 L 236,145 L 256,325 L 206,355 Z" fill="#38BDF8" opacity="0.85"/>

    <!-- Right Wing of 'V' (Gold/Amber Accent Hue) -->
    <path d="M 326,175 L 256,325 L 282,340 L 356,190 Z" fill="url(#accentGrad)"/>
    <path d="M 326,175 L 276,145 L 256,325 L 306,355 Z" fill="#FCD34D" opacity="0.9"/>

    <!-- Center vertex core -->
    <circle cx="256" cy="325" r="9" fill="#FFFFFF"/>
    <circle cx="256" cy="325" r="16" fill="#38BDF8" opacity="0.4"/>
  </g>

  <!-- Modern Accent Dots / Nodes -->
  <circle cx="136" cy="176" r="5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="376" cy="176" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="256" cy="380" r="5" fill="#38BDF8" opacity="0.8"/>
</svg>
